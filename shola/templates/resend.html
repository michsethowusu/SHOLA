{% extends "base.html" %}
{% block title %}Request a SHOLA link{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap narrow">
    <p class="eyebrow">Your link</p>
    <h1 style="font-size:clamp(1.8rem,6vw,2.4rem)">Request a link</h1>
    <p class="muted">
      SHOLA has no password. Enter the email you signed up with and we will send
      today's words to your inbox.
    </p>

    <form method="post" style="margin-top:26px">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <button class="btn wide" type="submit">Send my link</button>
    </form>

    <p class="hint center" style="margin-top:16px">
      Not signed up yet? <a href="{{ url_for('main.join') }}">Join SHOLA</a>.
    </p>
  </div>
</section>
{% endblock %}
