<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#faf7f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf7f2;">
  <tr>
    <td align="center" style="padding:28px 14px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:480px;background:#ffffff;border:1px solid #e7e0d5;border-radius:20px;">
        <tr>
          <td style="padding:24px 26px 4px;">
            <div style="font:800 20px/1.1 'Trebuchet MS',Helvetica,Arial,sans-serif;letter-spacing:-.5px;color:#1a1815;">
              SH<span style="color:#c0392b;">Ɔ</span>LA
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 26px 0;">
            <h1 style="margin:0 0 8px;font:700 23px/1.2 'Trebuchet MS',Helvetica,Arial,sans-serif;letter-spacing:-.6px;color:#1a1815;">
              Confirm your email, {{ first }}
            </h1>
            <p style="margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#57514a;">
              Enter this code on the SHOLA page to start checking words.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:22px 26px 6px;">
            <div style="display:inline-block;background:#faf7f2;border:1px solid #e7e0d5;border-radius:14px;padding:18px 30px;font:700 34px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:9px;color:#1a1815;">
              {{ code }}
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:12px 26px 26px;">
            <p style="margin:0;font:13px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#8b8379;text-align:center;">
              It expires in {{ minutes }} minutes. If you did not sign up to SHOLA,
              ignore this email — nothing was created.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
