<!doctype html>
<html>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"></head>
<body style="margin:0;padding:0;background:#faf7f2;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#faf7f2;">
  <tr>
    <td align="center" style="padding:28px 14px 40px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
             style="max-width:520px;background:#ffffff;border:1px solid #e7e0d5;border-radius:20px;">
        <tr>
          <td style="padding:24px 26px 4px;">
            <div style="font:800 20px/1.1 'Trebuchet MS',Helvetica,Arial,sans-serif;letter-spacing:-.5px;color:#1a1815;">
              SH<span style="color:#c0392b;">Ɔ</span>LA
            </div>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 26px 0;">
            <h1 style="margin:0 0 10px;font:700 25px/1.15 'Trebuchet MS',Helvetica,Arial,sans-serif;letter-spacing:-.7px;color:#1a1815;">
              {{ language_name }} is open, {{ first }}
            </h1>
            <p style="margin:0 0 6px;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#57514a;">
              You asked us to tell you the day we started collecting
              {{ language_name }}. Your first list of words is ready.
            </p>
            <p style="margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#57514a;">
              A handful of words on the days you chose. Two minutes each time.
            </p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 26px 8px;">
            <a href="{{ link }}"
               style="display:inline-block;background:#c0392b;color:#ffffff;text-decoration:none;font:600 17px/1 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:17px 34px;border-radius:999px;">
              Check your first words
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:10px 26px 26px;">
            <p style="margin:0;font:13px/1.6 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#8b8379;text-align:center;">
              From now on your daily email arrives as normal.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
