{% extends "base.html" %}
{% block title %}Log in to SHOLA{% endblock %}

{% block content %}
<section class="section">
  <div class="wrap narrow">
    <h1 style="font-size:clamp(1.8rem,6vw,2.4rem)">Log in</h1>
    <p class="muted">
      Enter your email and we will send you a link to log in.
    </p>

    <form method="post" style="margin-top:26px">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="email">
      </div>
      <button class="btn wide" type="submit">Send me a link</button>
    </form>

    <p class="hint center" style="margin-top:16px">
      Not signed up yet? <a href="{{ url_for('main.join') }}">Join SHOLA</a>.
    </p>
  </div>
</section>
{% endblock %}
